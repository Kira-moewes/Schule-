<title>KERNIG Nussmus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: one screen; oversized jar photos glide along a flat arc, a wine-red chamfered plinth with a turning word-ring sits behind the centre */
:root{
  --bg:#e9ecee; --fg:#2b1a14; --plinth:#8b1e2b; --ring:#ec6a3d; --brand:#b8402a; --pill:#fff; --muted:#8b8f94;
  --display:"Fraunces",Georgia,serif; --body:"Outfit",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191b;--fg:#eee6e0;--plinth:#7a1824;--ring:#f07a4f;--pill:#26292c;--muted:#9aa0a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191b;--fg:#eee6e0;--plinth:#7a1824;--ring:#f07a4f;--pill:#26292c;--muted:#9aa0a6;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;user-select:none;touch-action:none}
header{position:fixed;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;z-index:30;
  padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lang{display:flex}
.lang button,.menu{font:600 10px var(--body);letter-spacing:.08em;border:1px solid var(--muted);background:var(--bg);color:var(--fg);border-radius:99px;height:30px;min-width:30px;cursor:pointer}
.lang button+button{margin-left:-4px}
.lang button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;position:relative}
.menu{justify-self:end;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;height:26px;font-size:9px}
.menu i{width:18px;height:18px;border-radius:50%;background:var(--brand)}
.logo{width:clamp(96px,10vw,140px);display:block;margin-top:6px}
button:focus-visible,.jar:focus-visible{outline:2px solid var(--ring);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden}
#plinth{position:absolute;left:50%;transform:translateX(-50%);overflow:visible}
#plinth text{font:600 112px var(--display);fill:var(--ring);letter-spacing:10px}
#spin{transform-box:view-box;transform-origin:500px 640px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

.jar{position:absolute;left:0;top:0;width:var(--w);cursor:pointer;will-change:transform,filter}
.jar img{display:block;width:100%;pointer-events:none;filter:drop-shadow(0 30px 24px rgba(30,10,10,.25))}
.nut{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}

#tip{position:fixed;left:0;top:0;padding:7px 12px;border-radius:99px;background:var(--pill);color:var(--fg);font:600 9px var(--body);letter-spacing:.12em;
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#tip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ring);margin-right:6px;vertical-align:1px}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);color:#fff;font:600 9px var(--body);letter-spacing:.2em;z-index:30;white-space:nowrap}
.legal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:10px;color:var(--muted);z-index:30}

#detail{position:fixed;inset:auto 0 0;z-index:50;background:var(--pill);border-radius:24px 24px 0 0;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#detail.open{transform:none}
#detail>div{max-width:560px;margin:0 auto}
#detail small{font:600 11px var(--body);letter-spacing:.15em;color:var(--brand)}
#detail h2{font:600 32px var(--display);margin:4px 0 6px;text-wrap:balance}
#detail p{color:var(--muted);line-height:1.6;margin:0 0 16px}
#detail .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#detail b{font:600 20px var(--body);font-variant-numeric:tabular-nums;margin-right:auto}
#detail button{font:600 13px var(--body);border:0;border-radius:99px;padding:12px 20px;cursor:pointer}
#buy{background:var(--plinth);color:#fff}#close{background:none;color:var(--fg)}
@media (prefers-reduced-motion:reduce){#spin{animation:none}}
</style>

<header>
  <div class="lang"><button aria-pressed="false">DE</button><button aria-pressed="true">EN</button></div>
  <img class="logo" src="img/logo.png" alt="KERNIG">
  <button class="menu">MENÜ <i></i></button>
</header>

<main id="stage">
  <svg id="plinth" viewBox="0 0 1000 2000" aria-hidden="true">
    <defs>
      <clipPath id="clip"><polygon points="250,40 750,40 960,300 960,2000 40,2000 40,300"/></clipPath>
      <path id="c" d="M500,640 m-470,0 a470,470 0 1,1 940,0 a470,470 0 1,1 -940,0"/>
    </defs>
    <polygon points="250,40 750,40 960,300 960,2000 40,2000 40,300" fill="var(--plinth)" stroke="var(--plinth)" stroke-width="70" stroke-linejoin="round"/>
    <g clip-path="url(#clip)"><g id="spin"><text><textPath href="#c">GERÖSTET · GEMAHLEN · GELIEBT · GERÖSTET · GEMAHLEN · GELIEBT ·</textPath></text></g></g>
  </svg>
</main>
<div id="tip">PRODUKT ENTDECKEN</div>
<div class="hint">SCROLLEN ZUM ENTDECKEN</div>
<div class="legal">Impressum &amp; Datenschutz</div>
<aside id="detail" aria-live="polite"><div>
  <small id="dTag"></small><h2 id="dName"></h2><p id="dText"></p>
  <div class="row"><b id="dPrice"></b><button id="close">Schließen</button><button id="buy">In den Warenkorb</button></div>
</div></aside>

<script>
const P=[ // img, name, tag, price, text
 ["weiss","Weißes Mandelmus","100 % Mandeln · 500 g","12,90 €","Blanchierte Mandeln, langsam gemahlen. Mild, cremig, ideal für Porridge und Dressings."],
 ["erdnuss","Erdnussmus","100 % Erdnüsse · 500 g","7,90 €","Geröstete Erdnüsse, sonst nichts. Kein Palmöl, kein Zucker, kein Salz."],
 ["pumpkin","Pumpkin Spice","Limited Edition · 500 g","10,90 €","Haselnussmus mit Kürbis, Zimt und Sternanis. Schmeckt nach Herbst auf dem Löffel."],
 ["braun","Braunes Mandelmus","100 % Mandeln · 500 g","11,90 €","Ganze Mandeln mit Haut, kräftig geröstet. Nussig, leicht herb, perfekt aufs Brot."],
 ["schoko","Schoko Erdnuss","Limited Edition · 500 g","9,90 €","Erdnussmus mit Kakao. Für alle, die zwischen Erdnuss und Schokolade nicht wählen wollen."],
];
const N=P.length*2; // list repeated so the arc never runs empty
const st=document.getElementById('stage'),plinth=document.getElementById('plinth'),tip=document.getElementById('tip');
const jars=[...Array(N)].map((_,k)=>{const p=P[k%P.length],e=document.createElement('div');
  e.className='jar';e.tabIndex=k<P.length?0:-1;e.setAttribute('role','button');e.setAttribute('aria-label',p[1]);
  e.innerHTML=`<img src="img/${p[0]}.png" alt="">`;e.onclick=()=>openP(k);e.onkeydown=ev=>{if(ev.key==='Enter')openP(k)};st.appendChild(e);
  return{el:e,tilt:(k*37%13-6)}}); // fixed per-jar wobble so they don't look machine-aligned

let W,H,R,cx,cy,jw,STEP,pos=0,target=0,vel=0;
function layout(){W=innerWidth;H=innerHeight;
  jw=Math.max(150,Math.min(W*.24,H*.36)); // jar width; height ≈ 1.3×
  R=Math.max(W*1.3,H*1.6);cx=W/2;cy=H*.5+R;STEP=Math.asin(Math.min(jw*1.25/R,.9))*180/Math.PI;
  const pw=Math.min(W<700?W*.95:W*.62,H*1.05);Object.assign(plinth.style,{width:pw+'px',top:H*.5+'px'});jars.forEach(j=>j.el.style.setProperty('--w',jw+'px'))}
const wrap=a=>{a=((a%N)+N)%N;return a>N/2?a-N:a};
function frame(){
  if(!dragging)target+=.004; // idle drift
  const prev=pos;pos+=(target-pos)*.06;vel=pos-prev;
  const blur=Math.min(Math.abs(vel)*60,6),skew=Math.max(-25,Math.min(25,vel*600));
  jars.forEach((j,i)=>{const a=wrap(i-pos),deg=a*STEP,rad=deg*Math.PI/180,s=1-Math.min(Math.abs(a)*.12,.4),h=jw*1.3;
    const x=cx+R*Math.sin(rad)-jw/2,y=cy-R*Math.cos(rad)-h/2;
    j.el.style.transform=`translate(${x}px,${y}px) perspective(800px) rotateY(${skew}deg) rotate(${deg*2.2+j.tilt*Math.min(Math.abs(a),1)}deg) scale(${s})`;
    j.el.style.filter=blur>.3?`blur(${blur}px)`:'none';
    j.el.style.zIndex=20-Math.round(Math.abs(a)*2);j.el.style.visibility=Math.abs(a)>3.2?'hidden':'visible'});
  requestAnimationFrame(frame)}
addEventListener('wheel',e=>{target+=(e.deltaY+e.deltaX)*.0025},{passive:true});
let dragging=false,lastX=0;
addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});addEventListener('pointerup',()=>{dragging=false;target=Math.round(target)});
addEventListener('pointermove',e=>{const j=e.target.closest('.jar');
  if(j){const r=j.getBoundingClientRect();tip.style.transform=`translate(${r.left+r.width*.45}px,${r.top+r.height*.62}px)`}
  tip.style.opacity=j?1:0;
  if(dragging){target-=(e.clientX-lastX)*.006;lastX=e.clientX}});
const det=document.getElementById('detail');
function openP(k){const p=P[k%P.length];dTag.textContent=p[2].toUpperCase();dName.textContent=p[1];dText.textContent=p[4];dPrice.textContent=p[3];
  buy.textContent='In den Warenkorb';det.classList.add('open');target+=wrap(k-target)}
close.onclick=()=>det.classList.remove('open');
buy.onclick=()=>{buy.textContent='Im Warenkorb ✓'};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed',x===b)));
addEventListener('resize',layout);layout();requestAnimationFrame(frame);
</script>
