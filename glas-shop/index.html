<title>KERNIG Nussmus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: one screen; jar photos ride an invisible wheel whose hub sits below the fold, a rust arch with a turning word-ring rises behind them */
:root{
  --bg:#f3f1ed; --fg:#2b1a12; --arch:#8a2a1c; --ring:#e0683c; --pill:#fff; --muted:#8c7d74;
  --display:"Fraunces",Georgia,serif; --body:"Outfit",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1512;--fg:#f2e7de;--arch:#74220f;--ring:#ee8457;--pill:#2c221d;--muted:#b3a197;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1512;--fg:#f2e7de;--arch:#74220f;--ring:#ee8457;--pill:#2c221d;--muted:#b3a197;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;user-select:none;touch-action:none}
header{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lang{display:flex;gap:4px}
.lang button,.menu{font:600 11px var(--body);letter-spacing:.08em;border:1px solid var(--muted);background:none;color:var(--fg);border-radius:99px;height:30px;min-width:30px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ring);border-color:var(--ring);color:#fff}
.menu{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px}
.menu i{width:22px;height:22px;border-radius:50%;background:var(--ring)}
.logo{width:128px;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
button:focus-visible,.jar:focus-visible{outline:2px solid var(--ring);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden}
#arch{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:var(--arch);overflow:hidden;border-radius:50% 50% 0 0/38% 38% 0 0}
#ring{position:absolute;left:50%;top:0;animation:spin 70s linear infinite;pointer-events:none}
#ring text{font:600 70px var(--display);fill:var(--ring);letter-spacing:8px}
@keyframes spin{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(-360deg)}}

.jar{position:absolute;left:0;top:0;width:var(--w);cursor:pointer;will-change:transform;filter:drop-shadow(0 28px 22px rgba(40,15,5,.28))}
.jar img{display:block;width:100%;pointer-events:none}
.nut{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 10px rgba(40,15,5,.2))}

#tip{position:fixed;left:0;top:0;padding:7px 12px;border-radius:99px;background:var(--pill);color:var(--fg);font:600 10px var(--body);letter-spacing:.1em;
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#tip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ring);margin-right:6px;vertical-align:1px}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);color:#fff;font:600 10px var(--body);letter-spacing:.2em;z-index:5;white-space:nowrap}
.legal{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:11px;color:var(--muted);z-index:5}

#detail{position:fixed;inset:auto 0 0;z-index:7;background:var(--pill);border-radius:24px 24px 0 0;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#detail.open{transform:none}
#detail>div{max-width:560px;margin:0 auto}
#detail small{font:600 11px var(--body);letter-spacing:.15em;color:var(--ring)}
#detail h2{font:600 32px var(--display);margin:4px 0 6px;text-wrap:balance}
#detail p{color:var(--muted);line-height:1.6;margin:0 0 16px}
#detail .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#detail b{font:600 20px var(--body);font-variant-numeric:tabular-nums;margin-right:auto}
#detail button{font:600 13px var(--body);border:0;border-radius:99px;padding:12px 20px;cursor:pointer}
#buy{background:var(--arch);color:#fff}#close{background:none;color:var(--fg)}
@media (prefers-reduced-motion:reduce){#ring{animation:none}}
</style>

<header>
  <div class="lang"><button aria-pressed="true">DE</button><button aria-pressed="false">EN</button></div>
  <img class="logo" src="img/logo.png" alt="KERNIG">
  <button class="menu">MENÜ <i></i></button>
</header>

<main id="stage">
  <div id="arch">
    <svg id="ring" viewBox="0 0 1000 1000" aria-hidden="true">
      <path id="c" d="M500,500 m-430,0 a430,430 0 1,1 860,0 a430,430 0 1,1 -860,0" fill="none"/>
      <text><textPath href="#c">VOM KERN · INS GLAS · NUR NÜSSE · VOM KERN · INS GLAS · NUR NÜSSE ·</textPath></text>
    </svg>
  </div>
</main>
<div id="tip">PRODUKT ENTDECKEN</div>
<div class="hint">SCROLLEN ZUM ENTDECKEN</div>
<div class="legal">Impressum &amp; Datenschutz</div>
<aside id="detail" aria-live="polite"><div>
  <small id="dTag"></small><h2 id="dName"></h2><p id="dText"></p>
  <div class="row"><b id="dPrice"></b><button id="close">Schließen</button><button id="buy">In den Warenkorb</button></div>
</div></aside>

<script>
const P=[ // img, name, tag, price, text
 ["weiss","Weißes Mandelmus","100 % Mandeln · 500 g","12,90 €","Blanchierte Mandeln, langsam gemahlen. Mild, cremig, ideal für Porridge und Dressings."],
 ["erdnuss","Erdnussmus","100 % Erdnüsse · 500 g","7,90 €","Geröstete Erdnüsse, sonst nichts. Kein Palmöl, kein Zucker, kein Salz."],
 ["pumpkin","Pumpkin Spice","Limited Edition · 500 g","10,90 €","Haselnussmus mit Kürbis, Zimt und Sternanis. Schmeckt nach Herbst auf dem Löffel."],
 ["braun","Braunes Mandelmus","100 % Mandeln · 500 g","11,90 €","Ganze Mandeln mit Haut, kräftig geröstet. Nussig, leicht herb, perfekt aufs Brot."],
 ["schoko","Schoko Erdnuss","Limited Edition · 500 g","9,90 €","Erdnussmus mit Kakao. Für alle, die zwischen Erdnuss und Schokolade nicht wählen wollen."],
];
const N=P.length*2; // jars on the wheel: list repeated so the arc stays full
const st=document.getElementById('stage'),arch=document.getElementById('arch'),ring=document.getElementById('ring'),tip=document.getElementById('tip');
const jars=[...Array(N)].map((_,k)=>{const p=P[k%P.length],e=document.createElement('div');
  e.className='jar';e.tabIndex=k<P.length?0:-1;e.setAttribute('role','button');e.setAttribute('aria-label',p[1]);
  e.innerHTML=`<img src="img/${p[0]}.png" alt="">`;e.onclick=()=>openP(k);e.onkeydown=ev=>{if(ev.key==='Enter')openP(k)};st.appendChild(e);return e});
const nuts=[...Array(6)].map((_,k)=>{const n=new Image();n.src='img/mandel.png';n.alt='';n.className='nut';st.appendChild(n);
  return{el:n,a:k/6*N+.5,r:k%2?1.18:.86,rot:Math.random()*360,s:.6+Math.random()*.5}});

let W,H,R,cx,cy,jw,STEP,pos=0,target=0; // STEP: degrees between jars
function layout(){W=innerWidth;H=innerHeight;jw=Math.min(300,Math.max(130,Math.min(W*.2,H*.3)));
  R=Math.max(H*1.1,W*.62);cx=W/2;cy=H*.46+R;STEP=Math.asin(Math.min(jw*1.35/R,.9))*180/Math.PI;
  const aw=Math.min(Math.max(W*.86,W-32),H*1.15),ah=H*.58;Object.assign(arch.style,{width:aw+'px',height:ah+'px'});
  const rs=aw*1.15;Object.assign(ring.style,{width:rs+'px',height:rs+'px',top:-rs*.08+'px'});
  jars.forEach(j=>j.style.setProperty('--w',jw+'px'))}
const wrap=a=>{a=((a%N)+N)%N;return a>N/2?a-N:a};
function place(el,a,r,w,h,extra){const deg=a*STEP,rad=deg*Math.PI/180;
  el.style.transform=`translate(${cx+R*r*Math.sin(rad)-w/2}px,${cy-R*r*Math.cos(rad)-h/2}px) rotate(${deg*1.4+extra}deg)`;return deg}
function frame(t){target+=.006;pos+=(target-pos)*.07;
  jars.forEach((j,i)=>{const a=wrap(i-pos),s=1-Math.min(Math.abs(a)*.07,.3);
    place(j,a,1,jw,jw*1.3,0);j.style.transform+=` scale(${s})`;j.style.zIndex=20-Math.round(Math.abs(a)*2);j.style.visibility=Math.abs(a)>4?'hidden':'visible'});
  nuts.forEach(n=>{const a=wrap(n.a-pos*1.25);const w=jw*.35*n.s;n.el.style.width=w+'px';
    place(n.el,a,n.r,w,w*.55,n.rot+t*.02);n.el.style.zIndex=n.r>1?1:25;n.el.style.visibility=Math.abs(a)>4?'hidden':'visible'});
  requestAnimationFrame(frame)}
addEventListener('wheel',e=>{target+=(e.deltaY+e.deltaX)*.003},{passive:true});
let dragX=null;addEventListener('pointerdown',e=>dragX=e.clientX);addEventListener('pointerup',()=>dragX=null);
addEventListener('pointermove',e=>{tip.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`;tip.style.opacity=e.target.closest('.jar')?1:0;
  if(dragX!==null){target-=(e.clientX-dragX)*.008;dragX=e.clientX}});
const det=document.getElementById('detail');
function openP(k){const p=P[k%P.length];dTag.textContent=p[2].toUpperCase();dName.textContent=p[1];dText.textContent=p[4];dPrice.textContent=p[3];
  buy.textContent='In den Warenkorb';det.classList.add('open');target+=wrap(k-target)}
close.onclick=()=>det.classList.remove('open');
buy.onclick=()=>{buy.textContent='Im Warenkorb ✓'};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed',x===b)));
addEventListener('resize',layout);layout();requestAnimationFrame(frame);
</script>
