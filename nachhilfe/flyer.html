<title>Nachhilfe-Flyer Kira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500&family=Inter:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Printed A4: one image band with wordmark, then lots of white, one line of facts, QR, tear-offs. Single light look (paper). */
:root{--bg:#ecebe6;--ink:#24261f;--muted:#7a7c72;--line:#d9d8d0;color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Helvetica Neue",system-ui,sans-serif}
.controls{max-width:210mm;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;font-size:14px}
.controls input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:999px;width:100%;box-sizing:border-box;background:#fff;color:var(--ink)}
.controls p{margin:0;color:var(--muted);word-break:break-all}
.scale{overflow-x:auto;padding-bottom:24px}
.sheet{width:210mm;height:297mm;margin:0 auto;background:#fff;box-sizing:border-box;padding:12mm 14mm 0;display:flex;flex-direction:column;box-shadow:0 2px 16px rgba(0,0,0,.1)}
.visual{position:relative;height:96mm;border-radius:6mm;overflow:hidden;background:linear-gradient(#d6d9ce,#a9b49d);color:#fff}
.visual svg{position:absolute;inset:0;width:100%;height:100%}
.visual span{position:absolute;top:7mm;left:8mm;font-size:8.5pt;letter-spacing:.16em;text-transform:uppercase}
.wordmark{position:absolute;left:0;right:0;bottom:-14mm;text-align:center;font-family:"Manrope",sans-serif;font-weight:300;font-size:180pt;line-height:1;letter-spacing:-.05em}
.main{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;margin-top:20mm}
h1{font-family:"Manrope",sans-serif;font-weight:300;font-size:30pt;line-height:1.12;letter-spacing:-.025em;margin:0}
.sub{margin:6mm 0 0;font-size:12pt;color:var(--muted);line-height:1.6}
.qr{text-align:center;font-size:8.5pt;color:var(--muted);flex:none}
.qr #qr{width:34mm;height:34mm;margin-bottom:2mm}
.qr #qr img,.qr #qr canvas{width:34mm!important;height:34mm!important}
.meta{display:flex;justify-content:space-between;gap:6mm;margin-top:14mm;padding-top:5mm;border-top:.3mm solid var(--line);font-size:11pt}
.meta b{font-weight:500}
.tabs{margin-top:auto;display:grid;grid-template-columns:repeat(8,1fr);border-top:.3mm dashed var(--muted);height:50mm}
.tab{border-left:.3mm dashed var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-size:9pt;text-align:center;line-height:1.4}
.tab:first-child{border-left:none}
@media print{@page{size:A4;margin:0}body{background:#fff}.controls{display:none}.scale{overflow:visible;padding:0}.sheet{box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<div class="controls">
  <label for="url">Adresse deiner Seite (für den QR-Code)</label>
  <input id="url" value="https://[deine-seite].de">
  <label for="ort">Kennung für diesen Aushangort (z.&nbsp;B. baecker, rewe)</label>
  <input id="ort" value="aushang1">
  <p>Der QR-Code führt auf: <span id="target"></span></p>
</div>

<div class="scale"><div class="sheet">
  <div class="visual">
    <svg viewBox="0 0 1200 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="#bcc3ae" d="M0 360 C200 290 380 340 560 310 S900 260 1200 310 V640 H0Z"/>
      <path fill="#9fac92" d="M0 440 C220 390 420 450 640 420 S980 390 1200 430 V640 H0Z"/>
      <path fill="#869579" d="M0 520 C240 480 460 530 700 505 S1020 485 1200 515 V640 H0Z"/>
    </svg>
    <span>Nachhilfe · Kerpen &amp; online</span>
    <div class="wordmark">kira</div>
  </div>

  <div class="main">
    <div>
      <h1>Verstehen statt<br>auswendig lernen.</h1>
      <p class="sub">[Mathe und Englisch] für Klasse [5–10].<br>Die erste Stunde ist kostenlos.</p>
    </div>
    <div class="qr"><div id="qr"></div>Probestunde anfragen</div>
  </div>

  <div class="meta"><span><b>[10 €]</b> / 45 Minuten</span><span>[nachhilfe-adresse@beispiel.de]</span></div>

  <div class="tabs" id="tabs"></div>
</div></div>

<script>
const MAIL="[nachhilfe-adresse@beispiel.de]";
document.getElementById("tabs").innerHTML=Array(8).fill(`<div class="tab"><span>kira · 1. Stunde gratis<br>${MAIL}</span></div>`).join("");
const qrEl=document.getElementById("qr");
function draw(){
  const u=document.getElementById("url").value.trim(), o=document.getElementById("ort").value.trim();
  const t=u+(o?(u.includes("?")?"&":"?")+"ort="+encodeURIComponent(o):"");
  document.getElementById("target").textContent=t;
  qrEl.innerHTML="";
  if(window.QRCode) new QRCode(qrEl,{text:t,width:320,height:320,colorDark:"#24261f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  else qrEl.textContent="QR-Code konnte nicht geladen werden";
}
["url","ort"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
draw();
</script>
